name: Build Social Downloader EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Download and Extract FFmpeg
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
        Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
        $ffmpegBin = Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -ExpandProperty DirectoryName
        echo "FFMPEG_PATH=$ffmpegBin" >> $env:GITHUB_ENV

    - name: Build with PyInstaller (Including FFmpeg)
      run: |
        pyinstaller --noconsole --onefile --add-binary "${{ env.ENV.FFMPEG_PATH }}/ffmpeg.exe;." --name "SocialDownloader" main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SocialDownloader-EXE
        path: dist/SocialDownloader.exe
